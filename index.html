<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="작물과 평수만 넣으면 필요한 수정벌 벌통 수, 투입 일정, 예상 금액을 바로 계산해요.">
<title>벌써예약 수정벌 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Archivo:wght@600;800&display=swap">
<style>
/* Layout: one column, everything on one screen. Inputs on top, live result card below, sticky buy bar at the bottom. */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --ink:#1E241B; --muted:#5E6858; --line:#D9DED2;
  --honey:#F2A71B; --honey-ink:#2A1C00; --honey-soft:#FDF0D3;
  --leaf:#2E6A47; --leaf-soft:#E3EFE6; --warn:#A3530C;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1D231B; --ink:#EEF1EA; --muted:#A3AD9C; --line:#333C30;
  --honey:#F5B53A; --honey-ink:#231700; --honey-soft:#3A2C10;
  --leaf:#7DC79A; --leaf-soft:#22362A; --warn:#F0A060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1D231B; --ink:#EEF1EA; --muted:#A3AD9C; --line:#333C30;
  --honey:#F5B53A; --honey-ink:#231700; --honey-soft:#3A2C10;
  --leaf:#7DC79A; --leaf-soft:#22362A; --warn:#F0A060; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 132px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
h1{font-size:27px;line-height:1.25;margin:4px 0 0;letter-spacing:-.03em;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--honey-soft) 62%)}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}

.q{display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qh h2{margin:0;font-size:17px;letter-spacing:-.01em}
.qh .n{font-family:var(--f-num);font-weight:800;color:var(--leaf);margin-right:6px}
.link{background:none;border:0;color:var(--leaf);font:inherit;font-size:14px;font-weight:500;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.crops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crop{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 6px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;min-height:52px;line-height:1.25}
.crop small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;font-variant-numeric:tabular-nums}
.crop[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--leaf)}
.crop:focus-visible,.chip:focus-visible,.seg button:focus-visible,.btn:focus-visible,.link:focus-visible,.stepper button:focus-visible,input:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.more{display:flex;flex-direction:column;gap:12px}
.more h3{margin:4px 0 0;font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}

.area{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.arow{display:flex;align-items:center;gap:10px}
.arow input[type=number]{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--f-num);font-weight:800;font-size:40px;letter-spacing:-.02em;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.arow input::-webkit-outer-spin-button,.arow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.conv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.err{color:var(--warn);font-size:13px;margin:0}

details.opts{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:4px 14px}
details.opts summary{cursor:pointer;padding:10px 0;font-weight:500;font-size:15px;list-style:none;display:flex;justify-content:space-between}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::after{content:"+";color:var(--muted);font-family:var(--f-num)}
details.opts[open] summary::after{content:"−"}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.opt input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

.result{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.rlabel{font-size:13px;opacity:.75}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-family:var(--f-num);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.03em;color:var(--honey);font-variant-numeric:tabular-nums}
.big span{font-size:20px;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:color-mix(in srgb,var(--bg) 18%,transparent);border-radius:12px;overflow:hidden}
.facts div{background:var(--ink);padding:10px 8px;text-align:center}
.facts b{display:block;font-family:var(--f-num);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.facts small{font-size:12px;opacity:.75}
.tl{display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:56px}
.track::before{content:"";position:absolute;left:0;right:0;top:20px;height:2px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.dot{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot i{display:block;width:16px;height:16px;border-radius:50%;background:var(--honey);border:3px solid var(--ink);margin-top:13px}
.dot.hot i{background:var(--warn)}
.dot em{font-style:normal;opacity:.8}
.dot:first-child{transform:none;align-items:flex-start}
.dot:last-child{transform:translateX(-100%);align-items:flex-end}
.money{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid color-mix(in srgb,var(--bg) 20%,transparent);padding-top:14px}
.money b{font-family:var(--f-num);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.why{font-size:13px;opacity:.8;line-height:1.6}
.why summary{cursor:pointer;opacity:1}
.why ul{margin:8px 0 0;padding-left:18px}
.empty{opacity:.8;font-size:15px}

.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}

.buybar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.buyin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.buyin .sum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.buyin .sum b{display:block;color:var(--ink);font-family:var(--f-num);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:17px;padding:15px 22px;cursor:pointer}
.btn.primary{background:var(--honey);color:var(--honey-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.sheet h2{margin:0;font-size:20px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.pick label:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft)}
.pick input{accent-color:var(--leaf);width:20px;height:20px}
.pick .t{flex:1}
.pick .t small{display:block;color:var(--muted);font-size:13px}
.pick .p{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.stepper output{min-width:44px;text-align:center;font-family:var(--f-num);font-weight:800;font-size:18px}
.hint{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--honey-soft);color:var(--ink);margin:0}
.hint b{font-family:var(--f-num)}
a.btn{display:block;text-align:center;text-decoration:none}
.actions{display:flex;flex-direction:column;gap:8px}
.toast{font-size:14px;color:var(--leaf);margin:0;min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.big b{transition:color .2s}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="var(--honey)"/><path d="M10 13h12M9 17h14M10 21h12" stroke="var(--honey-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>
      벌써예약
    </div>
    <span class="tag">수정벌 계산기 · 시안</span>
  </div>

  <header>
    <h1>우리 하우스엔 <em>벌통 몇 통</em>?</h1>
    <p class="sub">작물 고르고 평수만 넣으면 바로 나와요.</p>
  </header>

  <section class="q" aria-labelledby="q1">
    <div class="qh"><h2 id="q1"><span class="n">1</span>무슨 작물인가요?</h2><button class="link" id="toggleMore" type="button" aria-expanded="false">작물 더 보기</button></div>
    <div class="crops" id="featured"></div>
    <div class="more" id="more" hidden></div>
  </section>

  <section class="q" aria-labelledby="q2">
    <div class="qh"><h2 id="q2"><span class="n">2</span>재배 면적은요?</h2></div>
    <div class="area">
      <div class="arow">
        <label for="area" class="sr" hidden>면적</label>
        <input id="area" type="number" inputmode="numeric" min="0" value="1200" aria-label="재배 면적">
        <div class="seg" role="group" aria-label="단위">
          <button type="button" id="uPy" aria-pressed="true">평</button>
          <button type="button" id="uM2" aria-pressed="false">㎡</button>
        </div>
      </div>
      <div class="conv" id="conv"></div>
      <input id="slider" type="range" min="0" max="5000" step="50" value="1200" aria-label="면적 슬라이더">
      <div class="chips" id="presets"></div>
      <p class="err" id="err" hidden></p>
    </div>
  </section>

  <details class="opts" id="opts">
    <summary>조건 더 넣고 정확하게</summary>
    <label class="opt"><span>연동 하우스예요<small>여러 동이 이어진 하우스 · 통수 ×1.1</small></span><input type="checkbox" id="wStruct"></label>
    <label class="opt"><span>수경·고설 재배예요<small>통수 ×1.15</small></span><input type="checkbox" id="wMethod"></label>
    <label class="opt"><span>첫 벌통 넣는 날<small>6~8월에 넣는 차수는 ×1.2</small></span><input type="date" id="start"></label>
  </details>

  <section class="result" aria-live="polite" id="result"></section>

  <p class="note">계산 기준은 시안용 가정값이에요. 작물별 기준 면적(예: 딸기 200평당 1통), 벌통 수명을 고려한 40일 간격, 재배 기간 180일, 1통 70,000원으로 계산했고 실제 수량·가격은 농가 상황과 공급처에 따라 달라질 수 있어요. 지역 보조금은 반영하지 않았어요.</p>
</main>

<div class="buybar">
  <div class="buyin">
    <div class="sum" id="barSum">작물과 면적을 넣어 주세요<b>—</b></div>
    <button class="btn primary" id="buy" type="button" disabled>바로 구매하기</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">얼마나 구매할까요?</h2>
    <div class="pick" id="pick"></div>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <a class="btn primary" id="go" href="https://smartstore.naver.com/sujungbul/products/4937483529" target="_blank" rel="noopener">스마트스토어에서 구매하기</a>
      <button class="btn ghost" id="copy" type="button">주문 내용 복사</button>
      <button class="btn ghost" id="close" type="button">닫기</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
  </div>
</div>

<script>
// ── Assumptions (from the admin console screenshots; adjust freely) ──
const CFG = { pricePerHive:70000, intervalDays:40, seasonDays:180, firstLeadDays:14,
  wStruct:1.1, wMethod:1.15, wHot:1.2, hotMonths:[6,7,8], areaMin:10, areaMax:100000, PY_M2:3.3058 };
const CROPS = [
  // [id, name, 평/통, group]
  ['STRAWBERRY','딸기',200,'시설 채소'],['TOMATO','토마토',200,'시설 채소'],['MELON','참외·멜론',200,'시설 채소'],
  ['PEPPER','고추·파프리카',125,'시설 채소'],['WATERMELON','수박',300,'노지'],['CUCUMBER','오이',300,'시설 채소'],
  ['SQUASH','호박',200,'시설 채소'],['EGGPLANT','가지',200,'시설 채소'],['GOURD','동아·박',200,'시설 채소'],
  ['BLUEBERRY','블루베리',125,'과수'],['HARDY_KIWI','다래',125,'과수'],['OMIJA','오미자',200,'과수'],
  ['APPLE','사과',125,'과수'],['PEAR','배',125,'과수'],['PEACH','복숭아·자두',200,'과수'],
  ['PERSIMMON','감',200,'과수'],['CHERRY','체리',125,'과수'],['KIWI','키위',125,'과수'],
  ['MANGO','망고',125,'열대 과일'],['PAPAYA','파파야',200,'열대 과일'],['PASSION','패션후르츠',125,'열대 과일'],
  ['ONION','양파·대파',80,'씨앗 받기(채종)'],['RADISH','무·배추',80,'씨앗 받기(채종)'],['ANGELICA','당귀·천궁',80,'씨앗 받기(채종)'],
  ['CARROT','당근',80,'씨앗 받기(채종)'],['GINSENG','인삼',125,'씨앗 받기(채종)'],
].map(([id,name,per,group])=>({id,name,per,group}));
const FEATURED = ['STRAWBERRY','TOMATO','MELON','PEPPER','WATERMELON','CUCUMBER'];

const $ = s=>document.querySelector(s);
const won = n=>n.toLocaleString('ko-KR')+'원';
const fmt = n=>n.toLocaleString('ko-KR');
const state = { crop:'STRAWBERRY', unit:'py', last:null };

function cropBtn(c){
  const b=document.createElement('button'); b.type='button'; b.className='crop'; b.dataset.id=c.id;
  b.innerHTML=`${c.name}<small>${c.per}평당 1통</small>`;
  b.addEventListener('click',()=>{state.crop=c.id;paintCrops();calc();});
  return b;
}
function buildCrops(){
  const f=$('#featured'); FEATURED.forEach(id=>f.appendChild(cropBtn(CROPS.find(c=>c.id===id))));
  const groups=[...new Set(CROPS.map(c=>c.group))]; const m=$('#more');
  groups.forEach(g=>{
    const list=CROPS.filter(c=>c.group===g&&!FEATURED.includes(c.id)); if(!list.length) return;
    const h=document.createElement('h3'); h.textContent=g; m.appendChild(h);
    const grid=document.createElement('div'); grid.className='crops'; list.forEach(c=>grid.appendChild(cropBtn(c))); m.appendChild(grid);
  });
  $('#toggleMore').addEventListener('click',e=>{const open=m.hidden; m.hidden=!open; e.target.setAttribute('aria-expanded',open); e.target.textContent=open?'접기':'작물 더 보기';});
}
function paintCrops(){document.querySelectorAll('.crop').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===state.crop));}

// Area handling: internal value always in 평
function areaPy(){const v=parseFloat($('#area').value); if(!isFinite(v)) return 0; return state.unit==='py'?v:v/CFG.PY_M2;}
function setArea(py){ $('#area').value = state.unit==='py'?Math.round(py):Math.round(py*CFG.PY_M2); syncSlider(); calc(); }
function syncSlider(){ $('#slider').value=Math.min(5000,Math.round(areaPy())); }
function buildPresets(){
  [300,600,1000,2000,3000].forEach(p=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=fmt(p)+'평';c.addEventListener('click',()=>setArea(p));$('#presets').appendChild(c);});
}
function setUnit(u){
  const py=areaPy(); state.unit=u;
  $('#uPy').setAttribute('aria-pressed',u==='py'); $('#uM2').setAttribute('aria-pressed',u==='m2');
  setArea(py);
}

function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function compute(){
  const crop=CROPS.find(c=>c.id===state.crop); const py=areaPy();
  if(py<CFG.areaMin||py>CFG.areaMax) return {error: py<CFG.areaMin ? `면적은 ${CFG.areaMin}평 이상 넣어 주세요.` : `${fmt(CFG.areaMax)}평까지 계산할 수 있어요.`};
  const ws=$('#wStruct').checked?CFG.wStruct:1, wm=$('#wMethod').checked?CFG.wMethod:1;
  const start=new Date($('#start').value+'T00:00:00');
  const rounds=Math.ceil(CFG.seasonDays/CFG.intervalDays);
  const raw=py/crop.per*ws*wm;
  const list=[]; for(let i=0;i<rounds;i++){const d=addDays(start,i*CFG.intervalDays);const hot=CFG.hotMonths.includes(d.getMonth()+1);list.push({d,hot,n:Math.ceil(raw*(hot?CFG.wHot:1)-1e-9)});}
  const total=list.reduce((s,r)=>s+r.n,0);
  return {crop,py,ws,wm,raw,list,total,first:list[0].n,cost:total*CFG.pricePerHive,firstCost:list[0].n*CFG.pricePerHive,anyHot:list.some(r=>r.hot)};
}

function calc(){
  const py=areaPy(); $('#conv').textContent = state.unit==='py' ? `≈ ${fmt(Math.round(py*CFG.PY_M2))}㎡` : `≈ ${fmt(Math.round(py))}평`;
  const r=compute(); state.last=r.error?null:r;
  const err=$('#err'); err.hidden=!r.error; err.textContent=r.error||'';
  const out=$('#result');
  if(r.error){ out.innerHTML=`<div class="rlabel">결과</div><div class="empty">면적을 넣으면 바로 계산돼요.</div>`; $('#buy').disabled=true; $('#barSum').innerHTML='면적을 확인해 주세요<b>—</b>'; return; }
  const same=r.list.every(x=>x.n===r.first);
  const span=CFG.intervalDays*(r.list.length-1);
  const dots=r.list.map((x,i)=>`<div class="dot${x.hot?' hot':''}" style="left:${r.list.length>1?i/(r.list.length-1)*100:0}%"><span>${x.d.getMonth()+1}/${x.d.getDate()}</span><i></i><em>${x.n}통</em></div>`).join('');
  out.innerHTML=`
    <div><div class="rlabel">${r.crop.name} · ${fmt(Math.round(r.py))}평 기준, 한 번에 넣을 벌통</div>
    <div class="big"><b>${r.first}</b><span>통</span></div></div>
    <div class="facts">
      <div><b>${CFG.intervalDays}일</b><small>마다 교체</small></div>
      <div><b>${r.list.length}번</b><small>시즌 투입</small></div>
      <div><b>${r.total}통</b><small>시즌 합계</small></div>
    </div>
    <div class="tl"><div class="rlabel">벌통 넣는 날${same?'':' · 주황색은 고온기(통수 ×1.2)'}</div><div class="track">${dots}</div></div>
    <div class="money"><span class="rlabel">시즌 예상 금액</span><b>${won(r.cost)}</b></div>
    <details class="why"><summary>어떻게 계산했나요?</summary><ul>
      <li>${fmt(Math.round(r.py))}평 ÷ ${r.crop.per}평(1통당)${r.ws>1?' × 1.1(연동)':''}${r.wm>1?' × 1.15(수경·고설)':''} = ${r.raw.toFixed(2)} → 올림 ${Math.ceil(r.raw-1e-9)}통</li>
      <li>벌통 수명을 고려해 ${CFG.intervalDays}일마다 새 벌통, 재배 기간 ${CFG.seasonDays}일 동안 ${r.list.length}번</li>
      ${r.anyHot?'<li>6~8월에 넣는 차수는 고온기라 1.2배</li>':''}
      <li>1통 ${won(CFG.pricePerHive)} × ${r.total}통 = ${won(r.cost)}</li></ul></details>`;
  $('#buy').disabled=false;
  $('#barSum').innerHTML=`1차 ${r.first}통 · 시즌 ${r.total}통<b>${won(r.cost)}</b>`;
}

// Buy sheet (destination is a placeholder until Josh decides)
let qty=0;
function openSheet(){
  const r=state.last; if(!r) return; qty=r.first;
  $('#pick').innerHTML=`
    <label><input type="radio" name="plan" value="first" checked><span class="t">1차분만 먼저<small>${r.list[0].d.getMonth()+1}월 ${r.list[0].d.getDate()}일 넣을 ${r.first}통</small></span><span class="p">${won(r.firstCost)}</span></label>
    <label><input type="radio" name="plan" value="season"><span class="t">시즌 전체<small>${r.list.length}번에 나눠 받는 ${r.total}통</small></span><span class="p">${won(r.cost)}</span></label>
    <label><input type="radio" name="plan" value="custom"><span class="t">수량 직접<small>필요한 만큼만</small></span>
      <span class="stepper"><button type="button" id="minus" aria-label="한 통 빼기">−</button><output id="qty">${qty}</output><button type="button" id="plus" aria-label="한 통 더하기">+</button></span></label>`;
  const setQ=n=>{qty=Math.max(1,Math.min(999,n));$('#qty').textContent=qty;document.querySelector('input[value=custom]').checked=true;};
  $('#minus').onclick=e=>{e.preventDefault();setQ(qty-1)}; $('#plus').onclick=e=>{e.preventDefault();setQ(qty+1)};
  $('#pick').addEventListener('change',paintHint); $('#minus').addEventListener('click',paintHint); $('#plus').addEventListener('click',paintHint);
  paintHint(); $('#toast').textContent=''; $('#sheetBg').hidden=false; $('#go').focus();
}
function planQty(){const r=state.last;const plan=document.querySelector('input[name=plan]:checked').value;return plan==='first'?r.first:plan==='season'?r.total:qty;}
function paintHint(){$('#hint').innerHTML=`네이버 스마트스토어가 새 창으로 열려요. 거기서 수량을 <b>${planQty()}통</b>으로 골라 주세요.`;}
function orderText(){
  const r=state.last; const plan=document.querySelector('input[name=plan]:checked').value;
  const n=plan==='first'?r.first:plan==='season'?r.total:qty;
  return `[벌써예약 주문] ${r.crop.name} ${fmt(Math.round(r.py))}평 / ${plan==='season'?'시즌 전체':plan==='first'?'1차분':'직접 입력'} ${n}통 / 1차 ${iso(r.list[0].d)} / 예상 ${won(n*CFG.pricePerHive)}`;
}
$('#buy').addEventListener('click',openSheet);
$('#close').addEventListener('click',()=>{$('#sheetBg').hidden=true;$('#buy').focus();});
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')$('#sheetBg').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sheetBg').hidden=true;});
$('#go').addEventListener('click',()=>{try{navigator.clipboard.writeText(orderText()).catch(()=>{});}catch(e){} $('#toast').textContent='스마트스토어로 이동했어요. 주문 내용은 복사해 두었어요.';});
$('#copy').addEventListener('click',()=>{const t=orderText();
  const ok=()=>$('#toast').textContent='복사했어요: '+t;
  try{navigator.clipboard.writeText(t).then(ok,()=>{$('#toast').textContent=t;});}catch(e){$('#toast').textContent=t;}});

// Wire up
buildCrops(); buildPresets(); paintCrops();
$('#start').value=iso(addDays(new Date(),CFG.firstLeadDays));
$('#area').addEventListener('input',()=>{syncSlider();calc();});
$('#slider').addEventListener('input',e=>{const py=+e.target.value; $('#area').value=state.unit==='py'?py:Math.round(py*CFG.PY_M2); calc();});
$('#uPy').addEventListener('click',()=>setUnit('py')); $('#uM2').addEventListener('click',()=>setUnit('m2'));
['#wStruct','#wMethod','#start'].forEach(s=>$(s).addEventListener('change',calc));
calc();
</script>

</body>
